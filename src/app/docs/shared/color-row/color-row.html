<div class="palette">
  <h3>{{ palette().name }}</h3>

  <div class="colors">
    @for (color of palette().colors; track color.token) {
      <div class="color-card">
        <div class="color-swatch" [style.background-color]="color.cssVariable"></div>

        <div class="color-info">
          <strong>{{ color.name }}</strong>
          <button class="token" (click)="copyToken(color.cssVariable)">
            {{ color.cssVariable }}

            @if (copiedToken() === color.cssVariable) {
              <small>✓ Copied</small>
            }
          </button>
          <span>{{ color.value }}</span>
        </div>
      </div>
    }
  </div>
</div>
